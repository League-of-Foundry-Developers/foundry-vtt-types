name: Compile against TypeScript nightly
on:
  schedule:
    - cron: 0 0 * * *

  workflow_dispatch:

env:
  node_version: 24

jobs:
  verify-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ env.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node_version }}
      - name: Cache Node.js modules
        uses: actions/cache@v6
        with:
          path: .npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-
      - run: npm ci --cache .npm --prefer-offline
      - run: |
          # This has been seen going in an infinite loop without `--legacy-peer-deps`.
          npm add --legacy-peer-deps --force -D typescript@next @typescript/native-preview
          npx tsc --version

      # Parentheses due to https://github.com/github/vscode-github-actions/issues/60

      - name: ESLint (Failing)
        if: (!cancelled())
        run: |
          status=0
          npm run eslint 2>&1 | tee "$RUNNER_TEMP/eslint.log"; status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo '::error::ESLint passed. Restore this step to `npm run eslint`.'
            exit 1
          fi

          if ! grep -q "typescript-eslint does not support TS" "$RUNNER_TEMP/eslint.log"; then
            echo "::error::ESLint failed for something other than the typescript-eslint incompatibility."
            exit 1
          fi

      - name: Format Check
        if: (!cancelled())
        run: npm run oxfmt

      - name: Type Check (exactOptionalPropertyTypes = false)
        if: (!cancelled())
        run: npx tsc --project tsconfig.nightly.json --exactOptionalPropertyTypes false

      - name: Type Check (TS Go)
        if: (!cancelled())
        run: npx tsgo --project tsconfig.nightly.json

      - name: Type Check (TS Go, exactOptionalPropertyTypes = false)
        if: (!cancelled())
        run: npx tsgo --project tsconfig.nightly.json --exactOptionalPropertyTypes false

      - if: (!cancelled())
        run: npm run test-types
